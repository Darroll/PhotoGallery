name: Publish image

# Public image for the Unraid Community Apps template: ghcr.io/darroll/photogallery
#   push to main  -> :edge and :sha-<short>  (testing builds; nobody is moved to them)
#   tag vX.Y.Z    -> :X.Y.Z, :X.Y and :latest  (what the template installs and Unraid updates to)
# Nothing is published unless the tests pass. A tag must match <Version> in src/PhotoGallery.csproj.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/PhotoGallery.csproj | head -1)
          [ "$want" = "$have" ] || { echo "Tag v$want does not match <Version>$have</Version>"; exit 1; }
      - name: Tests
        run: dotnet test tests/PhotoGallery.Tests -c Release --nologo

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/darroll/photogallery
          tags: |
            type=edge,branch=main
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
