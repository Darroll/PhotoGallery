name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. PhotoGallery aims to stay easy to set up, easy to run, positive only and limited social; see the principles in the [Roadmap](https://github.com/Darroll/PhotoGallery/blob/main/ROADMAP.md).
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you cope today?
