## SWAG subdomain proxy for Keycloak (single sign-on for the photo gallery).
## Public address: https://auth.darrollwalsh.com   (Keycloak runs as container "keycloak" on proxynet)
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name auth.*;

    include /config/nginx/ssl.conf;

    # The admin console and the master realm are only reachable on the LAN address (http://192.168.2.3:8083), never through this public name.
    location ~ ^/(admin|realms/master|metrics|health) {
        return 404;
    }

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        # Keycloak sends large headers and cookies (proxy.conf already sets proxy_buffers)
        proxy_buffer_size 16k;
        set $upstream_app keycloak;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
