## SWAG subdomain proxy for PhotoGallery.
## Save as /mnt/user/appdata/swag/nginx/proxy-confs/gallery.subdomain.conf
## Add "gallery" to SWAG's SUBDOMAINS (or use wildcard), point DNS gallery.<domain> at your WAN IP,
## forward 443 to SWAG, then restart SWAG. The container must be on the same Docker network as SWAG.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name gallery.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 95m;    # >= MAX_UPLOAD_MB + overhead (Cloudflare caps at 100m)
    proxy_read_timeout 900s;     # large ZIP / lossless exports
    proxy_send_timeout 900s;
    proxy_request_buffering off;
    proxy_buffering off;         # stream ZIPs instead of buffering them

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app photogallery;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
